apiVersion: v1
kind: ConfigMap
metadata:
  name: vehicle-store-config
  namespace: vehicle-store
data:
  POSTGRES_HOST: "vehicle-store-postgres-service"
  POSTGRES_PORT: "5432"

  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  API_WORKERS: "1"

  APP_NAME: "Vehicle Store API"
  APP_VERSION: "1.0.0"
  APP_ENVIRONMENT: "production"

  LOG_LEVEL: "INFO"

  CORS_ORIGINS: "*"
  CORS_CREDENTIALS: "true"
  CORS_METHODS: "*"
  CORS_HEADERS: "*"