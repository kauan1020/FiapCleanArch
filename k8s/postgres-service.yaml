apiVersion: v1
kind: Service
metadata:
  name: vehicle-store-postgres-service
  namespace: vehicle-store
  labels:
    app: vehicle-store-postgres
    component: database
spec:
  selector:
    app: vehicle-store-postgres
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  type: ClusterIP